# INSTRUCTOR-OWNED - defines the assignment. Dates live in the semester's schedule.yml.
title: Linear regression from scratch # the assignment's name, shown to graders and on the site
type: individual              # individual | group
submit_via: assignment_repo   # assignment_repo (they push to their repo) | external (handed in elsewhere: Moodle, Kaggle, in class - no repo is created) | shared_dropbox_repo (one private repo for the whole cohort, each student pushes into their own folder, peers can read it)
formats: [none]                  # ipynb | py | rmd | qmd | latex | none - chooses the starter stub only; grading reads whatever is in the repo

# questions:                  # OPTIONAL - the score skeleton, and the maximum shown beside
#   Q1: 15                    # each blank in the grading sheet. The total is their sum;
#   Q2: 10                    # there is no `points:` field anywhere.

autograde: true               # true: run tests/ at the cutoff and show the count to graders
completion_check: false       # true: execute the notebook at the cutoff, record whether it runs clean
grader_pdf: false             # true: at the cutoff, archive each submission filtered to its marked questions as a PDF for graders
tests: tests
